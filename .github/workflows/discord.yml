name: Announce published release on Discord
on:
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: discord-${{ github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  announce:
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test scripts/tests/discord-post.check.mjs
      - name: Publish release and patch notes
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          DISCORD_RELEASES_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          DISCORD_PATCH_NOTES_WEBHOOK: ${{ secrets.DISCORD_PATCH_NOTES_WEBHOOK }}
        run: node scripts/discord-release.mjs "$RELEASE_TAG" --send
      - name: Preserve delivery confirmations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: discord-delivery
          path: .discord-delivery/
          include-hidden-files: true
          if-no-files-found: ignore
